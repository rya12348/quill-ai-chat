name: Verify and deploy

on:
  pull_request:
  push:
    branches: [main]
  # A manual run from the Actions tab, for when a push landed while the
  # Cloudflare secrets were missing and the site needs to catch up.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ink-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the Pages preview deploy."
            {
              echo "### Pages deploy skipped"
              echo "This run only verified the code. Nothing reached the site, because"
              echo "\`CLOUDFLARE_API_TOKEN\` / \`CLOUDFLARE_ACCOUNT_ID\` are not set as repository secrets"
              echo "(Settings → Secrets and variables → Actions). Until they are, a push to main"
              echo "does **not** deploy."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.cloudflare.outputs.configured == 'true'
        run: npm run deploy:pages

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The last step commits DEPLOYED.md back to main with `[skip ci]`, which is
    # how a reader who only has the repository learns which commit is live.
    permissions:
      contents: write
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the Pages production deploy."
            {
              echo "### Production deploy skipped"
              echo "This commit is **not** live. \\`CLOUDFLARE_API_TOKEN\\` / \\`CLOUDFLARE_ACCOUNT_ID\\` are"
              echo "not set as repository secrets (Settings → Secrets and variables → Actions),"
              echo "so nothing was uploaded. Once they exist, re-run this workflow from the Actions tab."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Deploy the exact build to the isolated preview database first. The
      # deploy script refuses to continue unless health, readiness, guest
      # sign-in and a real chat turn pass.
      - name: Preview gate
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          PAGES_BRANCH: deploy-check-${{ github.run_id }}
        run: npm run deploy:pages
      # Only promote after the preview gate passes.
      - name: Production
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          PAGES_BRANCH: main
        run: npm run deploy:pages
      # Deploy and record are separate on purpose: the deploy has already passed
      # its smoke test by here, so this only copies what the site says about
      # itself into the repository. `[skip ci]` keeps it from deploying again.
      - name: Record the live commit
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          PAGES_URL: https://www.inkbrowser.dpdns.org
        run: |
          node scripts/record-deploy.mjs
          if git diff --quiet -- DEPLOYED.md; then
            echo "DEPLOYED.md already records this commit"
            exit 0
          fi
          git config user.name "ink deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add DEPLOYED.md
          git commit -m "Record ${GITHUB_SHA:0:7} as live [skip ci]"
          git push
